services:
  db:
    image: postgres:16-alpine
    container_name: stashbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stashbox
      POSTGRES_PASSWORD: codemonk
      POSTGRES_DB: stashbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stashbox -d stashbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: stashbox-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://stashbox:codemonk@db:5432/stashbox
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: stashbox-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata: